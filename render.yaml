services:
  - type: web
    name: imperium-realtors
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: IMPERIUM_ADMIN_EMAIL
        sync: false
      - key: IMPERIUM_ADMIN_PASSWORD
        sync: false
